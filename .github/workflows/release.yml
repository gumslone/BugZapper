name: release

# Optional standalone bundles (Python included, nothing to install), built with
# PyInstaller and attached to the GitHub Release for a v* tag. The repo itself
# stays the zero-install path — these are for users who just want an app.
#
# Publish one with:  git tag v1.1 && git push origin v1.1
# (workflow_dispatch builds the bundles as workflow artifacts without a release)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # PyInstaller bundles are architecture-specific, so macOS needs both:
        # an arm64 build for Apple Silicon and an x86_64 one for Intel Macs
        # (Rosetta translates Intel->ARM, never ARM->Intel, so an arm64-only
        # release simply cannot run on an Intel Mac).
        include:
          - os: macos-latest      # Apple Silicon (M1/M2/M3…)
            artifact: BugZapper-macos-arm64.zip
          - os: macos-15-intel    # Intel Macs
            artifact: BugZapper-macos-x64.zip
          - os: windows-latest
            artifact: BugZapper-windows-x64.exe
          - os: ubuntu-latest
            artifact: BugZapper-linux-x64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      # The vendored packages are frozen INTO the bundle (--paths vendor +
      # hidden imports) rather than shipped as loose data files — source
      # imports from a data dir would need stdlib modules PyInstaller prunes.
      # esptool / nodemcu_uploader are only imported dynamically (run_tool_mode),
      # so they must be named explicitly.

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir icon.iconset
          for s in 16 32 128 256; do sips -z $s $s icon.png --out icon.iconset/icon_${s}x${s}.png >/dev/null; done
          sips -z 32 32 icon.png --out icon.iconset/icon_16x16@2x.png >/dev/null
          sips -z 64 64 icon.png --out icon.iconset/icon_32x32@2x.png >/dev/null
          sips -z 256 256 icon.png --out icon.iconset/icon_128x128@2x.png >/dev/null
          iconutil -c icns icon.iconset -o icon.icns
          pyinstaller --noconfirm --windowed --name BugZapper --icon icon.icns \
            --paths vendor --paths . \
            --hidden-import esptool --collect-submodules nodemcu_uploader \
            --add-data "icon.png:." flashui.py
          dist/BugZapper.app/Contents/MacOS/BugZapper --run-esptool version
          # the artifact name promises an architecture — verify the binary matches
          got=$(lipo -archs dist/BugZapper.app/Contents/MacOS/BugZapper)
          case "${{ matrix.artifact }}" in
            *arm64*) want=arm64 ;;
            *x64*)   want=x86_64 ;;
          esac
          echo "built: $got, expected: $want"
          [ "$got" = "$want" ] || { echo "::error::arch mismatch: $got != $want"; exit 1; }
          ditto -c -k --keepParent dist/BugZapper.app "${{ matrix.artifact }}"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pip install pillow
          python -c "from PIL import Image; Image.open('icon.png').save('icon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          pyinstaller --noconfirm --windowed --onefile --name BugZapper --icon icon.ico `
            --paths vendor --paths . `
            --hidden-import esptool --collect-submodules nodemcu_uploader `
            --add-data "icon.png;." flashui.py
          $p = Start-Process -FilePath "dist\BugZapper.exe" -ArgumentList "--run-esptool","version" -PassThru -Wait
          if ($p.ExitCode -ne 0) { exit 1 }
          Move-Item dist\BugZapper.exe "${{ matrix.artifact }}"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --windowed --onefile --name BugZapper \
            --paths vendor --paths . \
            --hidden-import esptool --collect-submodules nodemcu_uploader \
            --add-data "icon.png:." flashui.py
          dist/BugZapper --run-esptool version
          tar -czf "${{ matrix.artifact }}" -C dist BugZapper

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
